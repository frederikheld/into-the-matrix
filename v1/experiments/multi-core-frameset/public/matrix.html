            newTrickleProbability: 0.1,
            changeSymbolProbability: 0.05,
            symbolSize: 24,
            debug: false
        }

        const blob = new Blob(['onmessage = function(e) { ' + workerMain.toString() + '; workerMain(); }'])
        const blobURL = window.URL.createObjectURL(blob)
        const worker = new Worker(blobURL)

        worker.addEventListener('message', (payload) => {
            console.log(payload)
        })

        window.addEventListener('load', () => {
            worker.postMessage('start')
        })

            const container = document.getElementById('container')
            const mc = new Matrix(container, options)

            function run () {

                postMessage(JSON.stringify(newDOMElement))

            }

            run()

        }

        function debug () {

        }
