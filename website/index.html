    <div id="container">

        <div class="screen" id="screen-1"></div>
        <div class="screen" id="screen-2"></div>
        <div class="screen" id="screen-3"></div>
    </div>

    <script>
        const cadence = 100

        const options = {
            newTrickleProbability: 0.05,
            changeSymbolProbability: 0.05,
            symbolSize: 12
        }

        const container1 = document.getElementById('screen-1')
        const mc1 = new Matrix(container1, options)
        const container2 = document.getElementById('screen-2')
        const mc2 = new Matrix(container2, options)
        const container3 = document.getElementById('screen-3')
        const mc3 = new Matrix(container3, options)

        window.addEventListener('load', () => {
            mc1.run(cadence)
            mc2.run(cadence)
            mc3.run(cadence)
        })
